<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#5a2d82"><title>ستائر أركان الطليعة</title>
<style>
:root{--p:#5a2d82;--g:#c9a24d;--bg:#f7f4fa}*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:#292331}header{background:var(--p);color:white;padding:20px 16px;text-align:center;border-bottom:5px solid var(--g)}header h1{font-size:22px;margin:0 0 6px}header p{margin:0;font-size:13px}main{max-width:900px;margin:18px auto;padding:0 12px}.card{background:white;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 3px 14px #24133b12;border:1px solid #eee}h2{font-size:18px;color:var(--p);margin:0 0 14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}label{font-size:13px;font-weight:bold;display:block;margin-bottom:6px}input,select,textarea{width:100%;padding:12px;border:1px solid #d9d0e2;border-radius:9px;font:inherit;background:#fff}button{font:inherit;border:0;border-radius:9px;padding:12px 15px;cursor:pointer;font-weight:bold}.primary{background:var(--p);color:white}.secondary{background:#eee7f5;color:var(--p)}.danger{background:#fde9e9;color:#a11}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.searchrow{display:flex;gap:8px}.searchrow input{flex:1}.customer{border:1px solid #e8e0ee;border-radius:10px;padding:12px;margin-top:9px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff}.customer button{padding:8px 10px}.muted{color:#716879;font-size:13px}.status{padding:10px;border-radius:9px;background:#f1ebf8;font-size:13px;line-height:1.7;white-space:pre-wrap}.detailgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.datum{background:#f8f5fb;padding:10px;border-radius:8px}.datum small{display:block;color:#776a82;margin-bottom:4px}.datum b{overflow-wrap:anywhere}.hidden{display:none!important}.full{grid-column:1/-1}.room-card{border:1px solid #d9c9e8;border-radius:12px;padding:12px;margin-top:12px;background:#fcfaff}.window-card{border:1px solid #eee5f5;border-radius:10px;padding:10px;margin-top:10px;background:white}.room-head,.window-head{display:flex;gap:8px;align-items:center;justify-content:space-between}.room-head input{flex:1}.room-title{color:var(--p);font-weight:bold}.small-btn{padding:8px 10px;font-size:13px}
@media(max-width:560px){.grid,.detailgrid{grid-template-columns:1fr}.customer{align-items:flex-start}.searchrow{flex-direction:column}}
</style></head><body>
<header><h1>ستائر أركان الطليعة</h1><p>ملف واحد لكل زبون — غرف وشبابيك متعددة</p></header><main>
<section class="card"><div style="display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap"><p class="muted" id="accountInfo">جارٍ الاتصال…</p></div><h2 id="formTitle">إضافة ملف زبون</h2>
<form id="customerForm"><div class="grid"><div><label for="name">اسم الزبون (اختياري)</label><input id="name" autocomplete="name" placeholder="اسم الزبون"></div><div><label for="phone">رقم الجوال (اختياري)</label><input id="phone" inputmode="tel" placeholder="رقم الجوال"></div><div class="full"><label for="notes">ملاحظات عامة (اختياري)</label><textarea id="notes" rows="2" placeholder="ملاحظات عن الزبون أو الفيلا"></textarea></div></div>
<div class="actions"><button class="secondary" id="addRoomBtn" type="button">＋ إضافة غرفة</button></div><div id="roomsContainer"></div>
<div class="actions"><button class="primary" type="submit" id="saveBtn">حفظ ملف الزبون</button><button class="secondary" type="button" id="clearBtn">ملف جديد / تفريغ</button></div></form></section>
<section class="card"><h2>قائمة الزبائن</h2><div class="searchrow"><input id="search" placeholder="ابحث بالاسم أو الجوال أو الغرف"><button class="secondary" id="refreshBtn" type="button">تحديث القائمة</button></div><p class="muted" id="count">عدد الملفات: 0</p><div id="customerList"></div></section>
<section class="card hidden" id="detailCard"><h2>ملف الزبون</h2><div id="details"></div><div class="actions"><button class="secondary" id="editBtn" type="button">تعديل الملف</button><button class="danger" id="deleteBtn" type="button">حذف الملف</button><button class="secondary" id="closeDetails" type="button">إغلاق</button></div></section>
<section class="card"><h2>حالة المزامنة</h2><div class="status" id="setupStatus">جارٍ الاتصال بقاعدة البيانات السحابية…</div></section></main><script type="module" src="app.js"></script></body></html>
